# Allowed parameters per filter.type, transcribed from the Qloo Entity Type
# Parameter Guide (docs.qloo.com/reference/available-parameters-by-entity-type).
# `filter.type` itself is always allowed. A parameter sent for a type it is not
# listed under is silently ignored by Qloo, so we validate against this and warn
# before sending. `urn:demographics` is not in the guide's matrix; it is used
# best-effort only and never validated here.
artist:
  allowed:
    - bias.trends
    - filter.exclude.entities
    - filter.parents.types
    - filter.popularity.min
    - filter.popularity.max
    - filter.exclude.tags
    - operator.exclude.tags
    - filter.external.exists
    - operator.filter.external.exists
    - filter.results.entities
    - filter.results.entities.query
    - filter.tags
    - operator.filter.tags
    - offset
    - signal.demographics.age
    - signal.demographics.audiences
    - signal.demographics.audiences.weight
    - signal.demographics.gender
    - signal.interests.entities
    - signal.interests.tags
    - take
